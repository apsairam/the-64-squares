<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#080808" />
    <title>Page not found — The 64 Squares</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #080808;
        --white: #f5f5f2;
        --muted: rgba(245, 245, 242, 0.72);
        --line: rgba(245, 245, 242, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          linear-gradient(90deg, rgba(8, 8, 8, 0.96), rgba(8, 8, 8, 0.72)),
          repeating-conic-gradient(
            from 0deg at 50% 50%,
            #101010 0deg 90deg,
            #f2f2f2 90deg 180deg
          );
        background-size: auto, 160px 160px;
        color: var(--white);
        font-family: Inter, system-ui, -apple-system, sans-serif;
        font-weight: 200;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(34rem, 100%);
        padding: clamp(1.5rem, 5vw, 3rem);
        border: 1px solid var(--line);
        background: rgba(8, 8, 8, 0.92);
      }

      .kicker,
      .meta {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .kicker {
        color: var(--muted);
      }

      h1 {
        margin: 0.7rem 0 0;
        font-size: clamp(2.8rem, 10vw, 5.5rem);
        font-weight: 100;
        letter-spacing: -0.055em;
        line-height: 0.9;
      }

      p {
        max-width: 28rem;
        margin: 1.4rem 0 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        margin-top: 2rem;
        padding: 0.8rem 1rem;
        border: 1px solid var(--white);
        color: var(--white);
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-transform: uppercase;
      }

      a:hover {
        background: var(--white);
        color: var(--bg);
      }

      a:focus-visible {
        outline: 2px solid var(--white);
        outline-offset: 4px;
      }

      .meta {
        margin-top: 2rem;
        color: rgba(245, 245, 242, 0.45);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="kicker">Archive Nº 64 · 404</div>
      <h1>Not in the archive.</h1>
      <p>
        This page is not part of the study. The board is still set, and the
        opening lesson is one move away.
      </p>
      <a href="/">Return to the board</a>
      <div class="meta">The 64 Squares</div>
    </main>
  </body>
</html>
